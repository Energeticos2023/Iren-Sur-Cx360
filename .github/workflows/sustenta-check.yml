name: Validar SUSTENTA R3
on:
  push:
    branches: [main]
    paths:
      - 'site/assets/sustenta.html'
      - 'site/assets/sustenta-revision-20261114.html'
      - 'supabase/functions/sustenta-ia/index.ts'
      - 'docs/SUSTENTA_PROMPT_MAESTRO_V1.md'
      - '.github/workflows/sustenta-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frontends and prompt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          prompt=Path('docs/SUSTENTA_PROMPT_MAESTRO_V1.md').read_text()
          assert len(prompt)==13477, "Prompt maestro incompleto"
          backend=Path('supabase/functions/sustenta-ia/index.ts').read_text()
          assert '1.0-complete-13477' in backend
          assert 'max_output_tokens' in backend
          assert 'status==="incomplete"' in backend
          for name in ('sustenta.html', 'sustenta-revision-20261114.html'):
              source=Path('site/assets/'+name).read_text()
              a=source.rfind('<script>')
              b=source.find('</script>',a)
              assert a!=-1 and b>a,name
              assert 'function showStructuredReview' in source,name
              assert 'async function analyzeWithAI' in source,name
              assert 'async function chatWithAI' in source,name
              assert 'loginForm' in source,name
              assert 'sustenta-ia' in source,name
              Path(name+'.js').write_text(source[a+len('<script>'):b])
          PY
          node --check sustenta.html.js
          node --check sustenta-revision-20261114.html.js
